services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ironman@3000
      POSTGRES_DB: pulsecheck
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:Ironman%403000@postgres:5432/pulsecheck
    depends_on:
      - postgres
  worker:
    build: ./worker
    env_file: ./worker/.env
    environment:
      DATABASE_URL: postgresql://postgres:Ironman%403000@postgres:5432/pulsecheck
    depends_on:
      - postgres
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  pgdata: