services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - redis
  worker:
    build: ./worker
    env_file: ./worker/.env
    depends_on:
      - redis
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://pulsecheck.bhosalevedant.dev/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  redisdata:
